# WinGet Configuration — declarative dev environment setup
# Apply:    winget configure .\configuration.dsc.yaml
# Validate: winget configure validate .\configuration.dsc.yaml
# Requires: winget v1.6.2631 or later
properties:
  configurationVersion: 0.2.0

  # assertions: prerequisites that must hold before applying
  assertions:
    - resource: Microsoft.Windows.Developer/OsVersion
      directives:
        description: Require Windows 10 or later
        allowPrerelease: true
      settings:
        MinVersion: "10.0.19041"

  # resources: desired state
  # Policy: the dev environment lives inside WSL. Keep the Windows side minimal
  #         (editor, terminal, WSL itself). Git / Node / language runtimes are
  #         managed inside the WSL distro with Nix via takuyaa/dotfiles
  #         (Home Manager). See README "WSL distro init". This resource installs
  #         the WSL feature only — distro + tooling are set up inside WSL.
  resources:
    # WSL itself (installs Ubuntu by default)
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: wsl
      directives:
        description: Install Windows Subsystem for Linux
      settings:
        id: Microsoft.WSL
        source: winget

    # A single VS Code on the Windows side; connect into WSL via the WSL extension.
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: vscode
      directives:
        description: Install Visual Studio Code (connect to WSL via the WSL extension)
      settings:
        id: Microsoft.VisualStudioCode
        source: winget

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: windows-terminal
      directives:
        description: Install Windows Terminal
      settings:
        id: Microsoft.WindowsTerminal
        source: winget

    # Git on the Windows side, only to clone / pull THIS dotfiles repo (the kanata
    # config + this winget file live in it). Dev-time Git lives inside WSL via Nix.
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: git
      directives:
        description: Install Git for Windows (to pull this dotfiles repo)
      settings:
        id: Git.Git
        source: winget

    # Global Git identity for commits made from the Windows host itself (e.g.
    # editing this windows/ layer in C:\Users\takuy\dotfiles). Dev-time Git
    # inside WSL gets its identity from Nix/Home Manager (home-common.nix);
    # the Windows host is separate, so without this `git commit` here fails
    # with "Author identity unknown". Writes %USERPROFILE%\.gitconfig.
    # git.exe is resolved explicitly because PATH may not refresh within a
    # single `winget configure` run right after the Git package installs.
    - resource: PSDscResources/Script
      id: git-identity
      dependsOn:
        - git
      directives:
        description: Set the global Git identity on the Windows host
      settings:
        GetScript: |
          $git = (Get-Command git -ErrorAction SilentlyContinue).Source
          @{ Result = if ($git) { & $git config --global user.email } else { '' } }
        TestScript: |
          $git = (Get-Command git -ErrorAction SilentlyContinue).Source
          if (-not $git) {
            foreach ($p in @("$env:ProgramFiles\Git\cmd\git.exe", "${env:ProgramFiles(x86)}\Git\cmd\git.exe", "$env:LOCALAPPDATA\Programs\Git\cmd\git.exe")) {
              if (Test-Path $p) { $git = $p; break }
            }
          }
          if (-not $git) { return $false }
          $name  = & $git config --global user.name  2>$null
          $email = & $git config --global user.email 2>$null
          ($name -eq 'Takuya Asano') -and ($email -eq 'takuya.a@gmail.com')
        SetScript: |
          $git = (Get-Command git -ErrorAction SilentlyContinue).Source
          if (-not $git) {
            foreach ($p in @("$env:ProgramFiles\Git\cmd\git.exe", "${env:ProgramFiles(x86)}\Git\cmd\git.exe", "$env:LOCALAPPDATA\Programs\Git\cmd\git.exe")) {
              if (Test-Path $p) { $git = $p; break }
            }
          }
          if (-not $git) { throw "git executable not found; ensure the Git package installed" }
          & $git config --global user.name  'Takuya Asano'
          & $git config --global user.email 'takuya.a@gmail.com'

    # Python on the Windows host. Language runtimes normally live in WSL (see
    # the policy note above), but this one is installed on Windows for scripts
    # that must run against the Windows environment (native paths, Win32 APIs).
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: python
      directives:
        description: Install Python 3.13
      settings:
        id: Python.Python.3.13
        source: winget

    # Japanese deck font (BIZ UDPGothic) for pptx/PDF consistency with WSL2.
    # Per-user install (no admin): copy the vendored TTFs into the per-user font
    # dir and register them under HKCU, so LibreOffice / PowerPoint-for-web /
    # Quick Look on this host resolve the same family as the WSL2 converter.
    # Source path assumes the repo is at C:\Users\takuy\dotfiles (same as kanata).
    # The fallback Noto Sans CJK JP is intentionally NOT installed here — the
    # authoritative PDF conversion runs on WSL2, which has both fonts via Nix.
    - resource: PSDscResources/Script
      id: fonts-biz-udp
      directives:
        description: Install vendored BIZ UDPGothic (per-user)
      settings:
        GetScript: |
          $reg = 'HKCU:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Fonts'
          @{ Result = (Get-ItemProperty -Path $reg -ErrorAction SilentlyContinue | Out-String) }
        TestScript: |
          $fontDir = "$env:LOCALAPPDATA\Microsoft\Windows\Fonts"
          $reg = 'HKCU:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Fonts'
          $fonts = @{
            'BIZ UDPGothic (TrueType)'      = 'BIZUDPGothic-Regular.ttf'
            'BIZ UDPGothic Bold (TrueType)' = 'BIZUDPGothic-Bold.ttf'
          }
          foreach ($name in $fonts.Keys) {
            $dest = Join-Path $fontDir $fonts[$name]
            if (-not (Test-Path $dest)) { return $false }
            $val = (Get-ItemProperty -Path $reg -Name $name -ErrorAction SilentlyContinue).$name
            if ($val -ne $dest) { return $false }
          }
          return $true
        SetScript: |
          $srcDir  = 'C:\Users\takuy\dotfiles\fonts\biz-udp'
          $fontDir = "$env:LOCALAPPDATA\Microsoft\Windows\Fonts"
          $reg = 'HKCU:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Fonts'
          New-Item -ItemType Directory -Path $fontDir -Force | Out-Null
          if (-not (Test-Path $reg)) { New-Item -Path $reg -Force | Out-Null }
          $fonts = @{
            'BIZ UDPGothic (TrueType)'      = 'BIZUDPGothic-Regular.ttf'
            'BIZ UDPGothic Bold (TrueType)' = 'BIZUDPGothic-Bold.ttf'
          }
          foreach ($name in $fonts.Keys) {
            $src  = Join-Path $srcDir $fonts[$name]
            $dest = Join-Path $fontDir $fonts[$name]
            if (-not (Test-Path $src)) { throw "font source not found: $src (is the repo at C:\Users\takuy\dotfiles?)" }
            Copy-Item -Path $src -Destination $dest -Force
            New-ItemProperty -Path $reg -Name $name -Value $dest -PropertyType String -Force | Out-Null
          }

    # Already-installed Chrome is detected and left as-is (no uninstall needed).
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: chrome
      directives:
        description: Install Google Chrome
      settings:
        id: Google.Chrome
        source: winget

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: onepassword
      directives:
        description: Install 1Password
      settings:
        id: AgileBits.1Password
        source: winget

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: powertoys
      directives:
        description: Install Microsoft PowerToys
      settings:
        id: Microsoft.PowerToys
        source: winget

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: discord
      directives:
        description: Install Discord
      settings:
        id: Discord.Discord
        source: winget

    # MTGA (WizardsoftheCoast.MTGALauncher) is intentionally NOT managed here.
    # As a WinGetPackage resource it re-executes the installer on every run --
    # winget's detection for the launcher never correlates, so the unit is judged
    # non-compliant each time -- and the installer auto-launches the game, popping
    # MTGA open on every `winget configure`. Rather than special-case it, we leave
    # it out. Install it by hand once on a fresh machine (it self-updates in-client
    # on launch, so winget never needs to manage it):
    #   winget install --id WizardsoftheCoast.MTGALauncher -e
    #
    # The pin below keeps `winget upgrade --all` from re-running the installer too
    # (same auto-launch problem via the upgrade path). Update MTGA deliberately
    # with `winget upgrade --all --include-pinned`.
    - resource: PSDscResources/Script
      id: mtga-pin
      directives:
        description: Pin MTGA so winget upgrade does not relaunch it
      settings:
        GetScript: |
          @{ Result = (winget pin list --id WizardsoftheCoast.MTGALauncher -e --disable-interactivity 2>$null | Out-String) }
        TestScript: |
          $out = (winget pin list --id WizardsoftheCoast.MTGALauncher -e --disable-interactivity 2>$null | Out-String)
          [bool]($out -match 'WizardsoftheCoast\.MTGALauncher')
        SetScript: |
          winget pin add --id WizardsoftheCoast.MTGALauncher -e --accept-source-agreements --disable-interactivity | Out-Null

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: steam
      directives:
        description: Install Steam
      settings:
        id: Valve.Steam
        source: winget

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: etcher
      directives:
        description: Install balenaEtcher
      settings:
        id: Balena.Etcher
        source: winget

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: slack
      directives:
        description: Install Slack
      settings:
        id: SlackTechnologies.Slack
        source: winget

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: claude
      directives:
        description: Install Claude desktop app
      settings:
        id: Anthropic.Claude
        source: winget

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: spotify
      directives:
        description: Install Spotify
      settings:
        id: Spotify.Spotify
        source: winget

    # Tailscale on the Windows host. Combined with networkingMode=mirrored in
    # .wslconfig (see the wslconfig resource below), this gives WSL access to the
    # tailnet, so `ssh dev` reaches the homelab over Tailscale. After install,
    # sign in once via the Tailscale GUI / `tailscale up` to join the tailnet.
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: tailscale
      directives:
        description: Install Tailscale (WSL reaches the tailnet via mirrored networking)
      settings:
        id: tailscale.tailscale
        source: winget

    # Google Japanese IME — robust key customization for the 英数/かな
    # mode keys (Muhenkan = IME off, Henkan = ひらがな). See README for the
    # exact key-setting steps to apply after install.
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: google-japanese-ime
      directives:
        description: Install Google Japanese IME
      settings:
        id: Google.JapaneseIME
        source: winget

    # kanata: advanced remapper for layers / tap-hold (e.g. Muhenkan layer).
    # Config lives in kanata.kbd next to this file. Verify the id with
    # `winget search kanata` if install fails.
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: kanata
      directives:
        description: Install kanata (GUI build — no console window, same CLI args)
      settings:
        id: jtroo.kanata_gui
        source: winget

    # ---- Keyboard customization ----
    # Use the physical JP keyboard as a US layout by substituting the Japanese
    # keyboard layout (00000411) with US (00000409) for the current user.
    # This is layout-level (works on USB/HID), unlike the old i8042prt
    # "LayerDriver JP106 = kbd101.dll" method which only affects PS/2 keyboards.
    # Takes effect after sign-out / sign-in.
    # (IME switching is handled by kanata emitting F13/F14 — layout-independent —
    #  bound in keymap.txt; see kanata.kbd.)
    - resource: PSDscResources/Registry
      id: kbd-layout-us
      directives:
        description: Substitute the JP keyboard layout with US for this user
      settings:
        Key: HKEY_CURRENT_USER\Keyboard Layout\Substitutes
        ValueName: "00000411"
        ValueType: String
        ValueData: "00000409"
        Ensure: Present
        Force: true

    # Remap CapsLock (0x3A) -> Left Ctrl (0x1D) via a Scancode Map.
    # Binary layout: 8-byte header, DWORD count (2 = 1 mapping + null),
    # mapping WORD pair (to=1D00, from=3A00), 4-byte null terminator.
    # Applies system-wide incl. the login screen; requires a reboot.
    - resource: PSDscResources/Registry
      id: kbd-scancode-map
      directives:
        description: Remap CapsLock to Left Ctrl
      settings:
        Key: HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Control\Keyboard Layout
        ValueName: Scancode Map
        ValueType: Binary
        ValueData: "0000000000000000020000001D003A0000000000"
        Ensure: Present
        Force: true

    # Disable the input-language / keyboard-layout switch hotkeys so the IME
    # stops flipping to a stray "日本語 (US)" layout by accident.
    # HKCU\Keyboard Layout\Toggle: value "3" = disabled for each of
    #   Language Hotkey (左Alt+Shift) / Layout Hotkey (Ctrl+Shift) / Hotkey.
    # Windows keeps the Japanese language's base keyboard layout (00000411)
    # around no matter what -- Set-WinUserLanguageList re-adds it on sign-in --
    # so we lock switching down instead of trying to delete that entry.
    # Win+Space still cycles manually; kill the remaining accidental path via
    # Settings -> 入力 -> キーボードの詳細設定: uncheck "アプリウィンドウごとに
    # 異なる入力方式を設定する" and set 既定の入力方式の上書き = Google日本語入力
    # (per-user UI state, not captured here). Takes effect after sign-in.
    - resource: PSDscResources/Registry
      id: kbd-toggle-language-hotkey
      directives:
        description: Disable the input-language switch hotkey (Alt+Shift)
      settings:
        Key: HKEY_CURRENT_USER\Keyboard Layout\Toggle
        ValueName: Language Hotkey
        ValueType: String
        ValueData: "3"
        Ensure: Present
        Force: true

    - resource: PSDscResources/Registry
      id: kbd-toggle-layout-hotkey
      directives:
        description: Disable the keyboard-layout switch hotkey (Ctrl+Shift)
      settings:
        Key: HKEY_CURRENT_USER\Keyboard Layout\Toggle
        ValueName: Layout Hotkey
        ValueType: String
        ValueData: "3"
        Ensure: Present
        Force: true

    - resource: PSDscResources/Registry
      id: kbd-toggle-hotkey
      directives:
        description: Disable the legacy input-switch hotkey
      settings:
        Key: HKEY_CURRENT_USER\Keyboard Layout\Toggle
        ValueName: Hotkey
        ValueType: String
        ValueData: "3"
        Ensure: Present
        Force: true

    # Pin Google日本語入力 as the default input method (既定の入力方式の上書き /
    # Set-WinDefaultInputMethodOverride): sign-in and new sessions default to
    # Google IME rather than the Japanese language's base keyboard layout.
    # The value is the Google IME text-service TIP: 0411:{lang-GUID}{profile-GUID};
    # it only records the *default*, so the ja language + Google IME must already
    # be added in Settings (per-user UI state). Takes effect after sign-in.
    - resource: PSDscResources/Registry
      id: ime-default-override
      directives:
        description: Set Google Japanese IME as the default input method
      settings:
        Key: HKEY_CURRENT_USER\Control Panel\International\User Profile
        ValueName: InputMethodOverride
        ValueType: String
        ValueData: "0411:{D5A86FD5-5308-47EA-AD16-9C4EB160EC3C}{773EB24E-CA1D-4B1B-B420-FA985BB0B80D}"
        Ensure: Present
        Force: true

    # Auto-start kanata at logon via a scheduled task.
    # Runs as the current user with an interactive token (no stored password)
    # and highest privileges, which kanata needs to install its keyboard hook.
    # NOTE: if a game/app misbehaves while kanata runs elevated, change
    #       -RunLevel Highest to Limited below and re-apply.
    - resource: PSDscResources/Script
      id: kanata-autostart
      dependsOn:
        - kanata
      directives:
        description: Register a logon scheduled task that starts kanata
      settings:
        GetScript: |
          @{ Result = (Get-ScheduledTask -TaskName 'kanata' -ErrorAction SilentlyContinue).TaskName }
        # Not just "does the task exist" -- also verify it points at THIS repo's
        # kanata.kbd. An older setup once registered the task against a stale copy
        # (C:\Users\takuy\Claude\Projects\...\kanata.kbd), so edits to the repo
        # config had no effect and an existence-only test never re-registered it.
        # Returning $false on a wrong --cfg path makes re-applying self-heal it.
        TestScript: |
          $t = Get-ScheduledTask -TaskName 'kanata' -ErrorAction SilentlyContinue
          if (-not $t) { return $false }
          # Must run unlimited: the default ExecutionTimeLimit (PT72H / 3 days)
          # makes Task Scheduler *terminate* the long-running kanata after 3 days
          # of continuous uptime (result 0x41306 SCHED_S_TASK_TERMINATED), and with
          # no logon/resume to re-trigger it, IME key remapping silently dies. Force
          # re-registration if a stale task still carries a time limit.
          if ($t.Settings.ExecutionTimeLimit -ne 'PT0S') { return $false }
          # Also self-heal the restart-on-failure recovery (crash -> auto relaunch).
          if ($t.Settings.RestartCount -ne 3 -or $t.Settings.RestartInterval -ne 'PT1M') { return $false }
          $cfg = 'C:\Users\takuy\dotfiles\windows\kanata.kbd'
          [bool]($t.Actions | Where-Object { $_.Arguments -like ('*"{0}"*' -f $cfg) })
        SetScript: |
          $exe = $null
          # winget exposes the canonical command as a shim under Links.
          $linkDirs = @("$env:LOCALAPPDATA\Microsoft\WinGet\Links", "$env:ProgramFiles\WinGet\Links")
          foreach ($d in $linkDirs) {
            if (Test-Path $d) {
              $f = Get-ChildItem -Path $d -Filter 'kanata*.exe' -ErrorAction SilentlyContinue |
                   Sort-Object { $_.Name -notmatch 'gui' } | Select-Object -First 1
              if ($f) { $exe = $f.FullName; break }
            }
          }
          # Fallback: search the extracted package payload, preferring a GUI build.
          if (-not $exe) {
            $pkgDirs = @("$env:LOCALAPPDATA\Microsoft\WinGet\Packages", "$env:ProgramFiles\WinGet\Packages")
            foreach ($d in $pkgDirs) {
              if (Test-Path $d) {
                $f = Get-ChildItem -Path $d -Filter 'kanata*.exe' -Recurse -ErrorAction SilentlyContinue |
                     Sort-Object { $_.Name -notmatch 'gui' } | Select-Object -First 1
                if ($f) { $exe = $f.FullName; break }
              }
            }
          }
          if (-not $exe) { throw "kanata executable not found under WinGet package directories" }
          $cfg = "C:\Users\takuy\dotfiles\windows\kanata.kbd"
          $action    = New-ScheduledTaskAction -Execute $exe -Argument ('--cfg "{0}"' -f $cfg)
          $trigger   = New-ScheduledTaskTrigger -AtLogOn
          $principal = New-ScheduledTaskPrincipal -UserId $env:USERNAME -LogonType Interactive -RunLevel Highest
          # kanata is a permanent daemon, but Task Scheduler is a launcher, not a
          # supervisor. Two settings make it behave more like systemd Restart=always:
          #   ExecutionTimeLimit Zero (=PT0S, "no time limit") -- else the default
          #     3-day cap reaps it (see TestScript note).
          #   RestartInterval/RestartCount -- if kanata's process exits/crashes,
          #     relaunch it after 1 min, up to 3 times. Together with the AtLogon
          #     trigger and the kanata-resume (sleep) task, that's 4 layers of
          #     coverage. (A service/SCM can't host kanata: services run in Session 0
          #     with no interactive desktop, but kanata needs the user session to
          #     install its WH_KEYBOARD_LL hook and SendInput -- hence a logon task.)
          $settings  = New-ScheduledTaskSettingsSet -AllowStartIfOnBatteries -DontStopIfGoingOnBatteries -ExecutionTimeLimit ([TimeSpan]::Zero) -RestartInterval (New-TimeSpan -Minutes 1) -RestartCount 3
          Register-ScheduledTask -TaskName 'kanata' -Action $action -Trigger $trigger -Principal $principal -Settings $settings -Force

    # Restart kanata whenever the system resumes from sleep/hibernate.
    # kanata's LLHOOK keyboard hook can silently detach on resume (upstream bug
    # jtroo/kanata#1307, still open). When it does, the process keeps running but
    # stops intercepting keys -- so Muhenkan/Henkan no longer toggle the IME,
    # because they only reach the IME as F13/F14 emitted by kanata; the raw
    # scancodes are dead under the US layout (see kanata.kbd, defcfg comment).
    # A clean Stop -> Start re-installs the hook. This registers a second task,
    # 'kanata-resume', fired by system resume events, that restarts the main
    # 'kanata' task after a short settle delay. The trigger watches Kernel-Power
    # EventID 507/107 ("resumed from a low-power state") -- NOT Power-Troubleshooter
    # EventID 1, which this machine's Modern Standby resumes never emit (verified:
    # PT-1 last fired 07/29 while Kernel-Power 507 fired many times/day), so the
    # original PT-1 trigger left the safety net dead. New-ScheduledTaskTrigger has no
    # event-trigger form, so the trigger is an MSFT_TaskEventTrigger CIM instance
    # with an XPath subscription (the standard workaround).
    - resource: PSDscResources/Script
      id: kanata-resume-restart
      dependsOn:
        - kanata-autostart
      directives:
        description: Register a scheduled task that restarts kanata on resume from sleep
      settings:
        GetScript: |
          @{ Result = (Get-ScheduledTask -TaskName 'kanata-resume' -ErrorAction SilentlyContinue).TaskName }
        # Self-heal if the task is missing or its action no longer restarts kanata.
        TestScript: |
          $t = Get-ScheduledTask -TaskName 'kanata-resume' -ErrorAction SilentlyContinue
          if (-not $t) { return $false }
          if (-not ($t.Actions | Where-Object { $_.Arguments -like '*Start-ScheduledTask -TaskName kanata*' })) { return $false }
          # Self-heal the trigger: the original watched Power-Troubleshooter EventID 1,
          # which does NOT fire on this machine's Modern Standby resumes (only
          # Kernel-Power 507 does), so the resume safety net was silently dead. Force
          # re-registration unless the subscription now covers Kernel-Power.
          [bool]($t.Triggers | Where-Object { $_.Subscription -like '*Kernel-Power*' })
        SetScript: |
          $cmd = 'Start-Sleep -Seconds 5; Stop-ScheduledTask -TaskName kanata -ErrorAction SilentlyContinue; Start-ScheduledTask -TaskName kanata'
          $action = New-ScheduledTaskAction -Execute 'powershell.exe' -Argument ('-NoProfile -WindowStyle Hidden -Command "{0}"' -f $cmd)
          # Event trigger: System log, resume from a low-power state. Watches
          # Kernel-Power 507/107 (reliable on Modern Standby) plus Power-Troubleshooter
          # 1 (legacy sleep) as a belt-and-suspenders OR.
          $class   = Get-CimClass -Namespace ROOT\Microsoft\Windows\TaskScheduler -ClassName MSFT_TaskEventTrigger
          $trigger = New-CimInstance -CimClass $class -ClientOnly
          $trigger.Enabled = $true
          $trigger.Subscription = "<QueryList><Query Id='0' Path='System'><Select Path='System'>*[System[(Provider[@Name='Microsoft-Windows-Kernel-Power'] and (EventID=507 or EventID=107)) or (Provider[@Name='Microsoft-Windows-Power-Troubleshooter'] and (EventID=1))]]</Select></Query></QueryList>"
          $principal = New-ScheduledTaskPrincipal -UserId $env:USERNAME -LogonType Interactive -RunLevel Highest
          $settings  = New-ScheduledTaskSettingsSet -AllowStartIfOnBatteries -DontStopIfGoingOnBatteries
          Register-ScheduledTask -TaskName 'kanata-resume' -Action $action -Trigger $trigger -Principal $principal -Settings $settings -Force

    # Relaunch ctfmon at logon once Google IME's engine is up, to cure a boot race.
    # Google 日本語入力's TIP is a two-part IME: a thin client DLL
    # (GoogleIMEJaTIP64.dll) that TSF loads into every app, and a separate engine
    # process (GoogleIMEJaConverter.exe) it talks to over IPC. At logon ctfmon comes
    # up early (via the MsCtfMonitor task) and makes Google IME the default input
    # method immediately -- but the engine is launched from the HKLM Run entry
    # "Google Japanese Input Prelauncher" (GoogleIMEJaBroker.exe), which sits behind
    # Windows' ~30s startup-app delay. Measured on this box: ctfmon 9:36:23, engine
    # 9:36:55. During that gap the TIP DLL loads with no engine to reach and wedges;
    # once wedged it never recovers, so the IME icon shows but nothing responds --
    # not Muhenkan/Henkan, not clicking the tray icon, not even Win+Space. Restarting
    # ctfmon after the engine is up re-instantiates the TIP against a live engine and
    # fixes it. This task automates that: it waits (up to 120s) for
    # GoogleIMEJaConverter, settles briefly, then -- only if a refresh is warranted
    # -- kills ctfmon and lets Windows' own MsCtfMonitor task respawn it against the
    # live engine.
    #
    # It fires on TWO triggers, for two failure modes:
    #   - AtLogon: the boot race above (ctfmon defaulted to Google IME's TIP before
    #     the engine existed -> TIP wedged). Detected as ctfmon older than the engine.
    #   - On resume (Kernel-Power 507/107): ctfmon/TSF can wedge after days of
    #     continuous uptime with no fresh logon (Fast Startup + Modern Standby;
    #     observed after ~5 days). Guarded by age: only refresh if ctfmon has run
    #     >24h, so normal frequent resumes don't churn the IME -- this just caps
    #     ctfmon's continuous runtime at ~1 day, well under the observed wedge point.
    # So the payload restarts ctfmon iff: it's missing, OR it started before the
    # engine (boot race), OR it's older than 24h (stale). Otherwise it does nothing.
    #
    # Two integrity constraints make the exact mechanism non-obvious:
    #   - Killing ctfmon requires elevation. A non-elevated Stop-Process ctfmon
    #     fails with Access Denied (verified), so an earlier RunLevel=Limited
    #     version of this task was a silent no-op. Hence RunLevel=Highest here.
    #   - But we must NOT Start-Process ctfmon from this elevated task: that would
    #     launch ctfmon at High integrity, and an elevated ctfmon can't service
    #     medium-integrity app windows (UIPI) -- breaking IME for normal apps.
    # The fix for both: kill elevated, then trigger the built-in MsCtfMonitor
    # (\Microsoft\Windows\TextServicesFramework\, RunLevel=Limited), which respawns
    # ctfmon at the correct medium integrity in the user session. Triggering
    # MsCtfMonitor also needs elevation (verified: Access Denied otherwise), which
    # this task has.
    - resource: PSDscResources/Script
      id: ime-ctfmon-relaunch
      directives:
        description: Register a logon task that restarts ctfmon after the IME engine starts
      settings:
        GetScript: |
          @{ Result = (Get-ScheduledTask -TaskName 'ime-ctfmon-relaunch' -ErrorAction SilentlyContinue).TaskName }
        # Self-heal if the task is missing, no longer runs elevated (can't kill
        # ctfmon otherwise), or its action no longer relaunches via MsCtfMonitor.
        TestScript: |
          $t = Get-ScheduledTask -TaskName 'ime-ctfmon-relaunch' -ErrorAction SilentlyContinue
          if (-not $t) { return $false }
          if ($t.Principal.RunLevel -ne 'Highest') { return $false }
          # Action must relaunch via MsCtfMonitor AND be the age-guarded version
          # (TotalHours check); a trigger must also cover resume (Kernel-Power).
          if (-not ($t.Actions | Where-Object { $_.Arguments -like '*MsCtfMonitor*' -and $_.Arguments -like '*TotalHours*' })) { return $false }
          [bool]($t.Triggers | Where-Object { $_.Subscription -like '*Kernel-Power*' })
        SetScript: |
          # Wait for GoogleIMEJaConverter, then refresh ctfmon only if warranted:
          # missing, or started before the engine (boot race), or older than 24h
          # (stale mid-session). A single-quoted here-string keeps the embedded
          # single quotes (task path) literal; we concatenate rather than use -f
          # because the payload contains { } braces.
          $cmd = @'
          try { $d=(Get-Date).AddSeconds(120); while (-not (Get-Process GoogleIMEJaConverter -ErrorAction SilentlyContinue) -and (Get-Date) -lt $d) { Start-Sleep -Seconds 2 }; Start-Sleep -Seconds 5; $eng = Get-Process GoogleIMEJaConverter -ErrorAction SilentlyContinue | Sort-Object StartTime | Select-Object -First 1; $ctf = Get-Process ctfmon -ErrorAction SilentlyContinue | Sort-Object StartTime | Select-Object -First 1; $raced = $ctf -and $eng -and ($ctf.StartTime -lt $eng.StartTime); $stale = $ctf -and ((New-TimeSpan -Start $ctf.StartTime).TotalHours -gt 24); if ((-not $ctf) -or $raced -or $stale) { Stop-Process -Name ctfmon -Force -ErrorAction SilentlyContinue; Start-Sleep -Seconds 1; Start-ScheduledTask -TaskPath '\Microsoft\Windows\TextServicesFramework\' -TaskName MsCtfMonitor } } catch {}
          '@
          $arg = '-NoProfile -WindowStyle Hidden -Command "' + $cmd.Trim() + '"'
          $action = New-ScheduledTaskAction -Execute 'powershell.exe' -Argument $arg
          # Two triggers: at logon (boot race) and on resume (Kernel-Power 507/107,
          # for the long-uptime wedge). Event trigger has no New-ScheduledTaskTrigger
          # form, so build it as an MSFT_TaskEventTrigger CIM instance.
          $tLogon  = New-ScheduledTaskTrigger -AtLogOn
          $class   = Get-CimClass -Namespace ROOT\Microsoft\Windows\TaskScheduler -ClassName MSFT_TaskEventTrigger
          $tResume = New-CimInstance -CimClass $class -ClientOnly
          $tResume.Enabled = $true
          $tResume.Subscription = "<QueryList><Query Id='0' Path='System'><Select Path='System'>*[System[(Provider[@Name='Microsoft-Windows-Kernel-Power'] and (EventID=507 or EventID=107)) or (Provider[@Name='Microsoft-Windows-Power-Troubleshooter'] and (EventID=1))]]</Select></Query></QueryList>"
          # Highest: needed to kill ctfmon and trigger MsCtfMonitor. ctfmon itself is
          # NOT started here -- MsCtfMonitor respawns it at the correct integrity.
          $principal = New-ScheduledTaskPrincipal -UserId $env:USERNAME -LogonType Interactive -RunLevel Highest
          $settings  = New-ScheduledTaskSettingsSet -AllowStartIfOnBatteries -DontStopIfGoingOnBatteries
          Register-ScheduledTask -TaskName 'ime-ctfmon-relaunch' -Action $action -Trigger $tLogon, $tResume -Principal $principal -Settings $settings -Force

    # ---- WSL networking ----
    # Deploy .wslconfig (networkingMode=mirrored) from this repo to %UserProfile%.
    # WSL only reads it from the fixed path %UserProfile%\.wslconfig, so we copy
    # rather than reference the repo path. The source of truth is windows/wslconfig.
    # Run `wsl --shutdown` after applying for the network mode change to take effect.
    - resource: PSDscResources/Script
      id: wslconfig
      directives:
        description: Deploy .wslconfig (mirrored networking) to the user profile
      settings:
        GetScript: |
          @{ Result = (Get-Content -Raw "$env:USERPROFILE\.wslconfig" -ErrorAction SilentlyContinue) }
        TestScript: |
          $src = 'C:\Users\takuy\dotfiles\windows\wslconfig'
          $dst = "$env:USERPROFILE\.wslconfig"
          if (-not (Test-Path $dst)) { return $false }
          (Get-FileHash $src).Hash -eq (Get-FileHash $dst).Hash
        SetScript: |
          $src = 'C:\Users\takuy\dotfiles\windows\wslconfig'
          $dst = "$env:USERPROFILE\.wslconfig"
          Copy-Item -Path $src -Destination $dst -Force

    # ---- SSH ----
    # Run the Windows OpenSSH authentication agent at boot. Ships Disabled by
    # default, which breaks VS Code Remote-SSH against a passphrase-protected
    # key: the extension pipes its bootstrap script into ssh.exe's stdin
    # (`type ...sh | ssh.exe -T -D <port> dev sh`), so the passphrase prompt
    # gets an empty string back and the connection dies with
    # "Permission denied (publickey)" even though the server accepted the key.
    # With the agent running, `AddKeysToAgent yes` (see windows/ssh_config)
    # unlocks the key once and there is no prompt left to mishandle.
    #
    # The key itself is NOT managed here: `ssh-add` needs the passphrase typed
    # interactively, and the result is DPAPI-encrypted into
    # HKCU\Software\OpenSSH\Agent\Keys. On a fresh machine, run `ssh dev` once
    # from a terminal and enter the passphrase; the agent caches it across
    # reboots from then on.
    - resource: PSDscResources/Service
      id: ssh-agent
      directives:
        description: Run the Windows OpenSSH authentication agent at boot
      settings:
        Name: ssh-agent
        StartupType: Automatic
        State: Running

    # Deploy the SSH client config to %UserProfile%\.ssh\config. ssh.exe only
    # reads it from that fixed path, so we copy rather than reference the repo
    # path. The source of truth is windows/ssh_config, which must be kept in
    # sync by hand with `programs.ssh.settings` in home-linux.nix (the WSL-side
    # client is a different binary reading a different file).
    - resource: PSDscResources/Script
      id: ssh-config
      directives:
        description: Deploy the SSH client config to the user profile
      settings:
        GetScript: |
          @{ Result = (Get-Content -Raw "$env:USERPROFILE\.ssh\config" -ErrorAction SilentlyContinue) }
        TestScript: |
          $src = 'C:\Users\takuy\dotfiles\windows\ssh_config'
          $dst = "$env:USERPROFILE\.ssh\config"
          if (-not (Test-Path $dst)) { return $false }
          (Get-FileHash $src).Hash -eq (Get-FileHash $dst).Hash
        SetScript: |
          $src = 'C:\Users\takuy\dotfiles\windows\ssh_config'
          $dst = "$env:USERPROFILE\.ssh\config"
          New-Item -ItemType Directory -Path (Split-Path $dst) -Force | Out-Null
          Copy-Item -Path $src -Destination $dst -Force
